# 策略参数 —— 多策略版本
# v3.0 重构：基于深度审查修复的参数
# 核心变更：止损/止盈现在由ATR动态止损接管，静态值仅作安全网

# ── 当前使用策略 ──
active_strategy: v2

# ════════════════════════════════════════════════════════
#  V1 简单动量策略 (Dual Momentum, Antonacci 2012)
# ════════════════════════════════════════════════════════
v1:
  roc_period: 20
  ma_period: 20
  min_return_pct: 0.0
  max_return_pct: 15.0
  buy_threshold: 0.10
  sell_threshold: -0.10
  position_per_sector: 0.20
  top_n: 5
  stop_loss: -0.05
  take_profit: 0.15
  rebalance_freq: monthly
  commission_rate: 0.0003
  slippage: 0.001

# ════════════════════════════════════════════════════════
#  V2 七因子专业评分策略 v3.0
#  核心改进：
#  - 外部因子从历史缓存读取（不再依赖实时API）
#  - Bear市场识别+空仓
#  - ATR动态止损（止损=买入价-2×ATR，追踪止盈=最高价回撤2×ATR）
#  - 景气度弱化否决权（×0.8软扣分，不再×0.3一票否决）
# ════════════════════════════════════════════════════════
v2:
  # ── 七因子权重（和=1.0）──
  weights:
    trend_strength: 0.25          # 趋势强度（核心择时）
    multi_window_momentum: 0.25  # 多窗口动量共振（核心择时）
    volume_confirm: 0.15         # 量能确认
    capital_flow: 0.15           # 资金因子（从历史缓存读取）
    sentiment: 0.10              # 情绪因子（从历史缓存读取）
    fundamental: 0.05            # 景气度（弱化，只扣分不否决）
    valuation: 0.05              # 估值因子（仓位调节器）

  # ── 均线过滤 ──
  ma60_period: 60

  # ── 买卖阈值 ──
  buy_threshold: 0.08
  sell_threshold: -0.10

  # ── 市场状态判定 ──
  regime_ma_period: 60
  regime_threshold: 0.00

  # ── 风控 ──
  # ATR动态止损已接管主要止损逻辑
  # 以下静态值仅作为安全网（极端情况兜底）
  stop_loss: -0.15           # 安全网止损（ATR止损失效时兜底）
  take_profit: 0.50          # 安全网止盈（追踪止盈失效时兜底）
  atr_baseline: 0.03         # ATR波动率仓位调节基准

  # ── 仓位 ──
  position_per_sector: 0.20  # 单板块基础仓位

  # ── 调仓 ──
  rebalance_freq: weekly     # 周频调仓（更快响应趋势变化）
  top_n: 5                   # 持仓5个板块（分散风险）
  commission_rate: 0.0003
  slippage: 0.001

  # ── ATR动态止损参数（新增）──
  atr_stop_multiplier: 3.0       # 止损距离：买入价 - 3×ATR（放宽，避免代表股聚合的高波动率误触）
  atr_trailing_multiplier: 3.0   # 追踪止盈：最高价回撤 3×ATR（让利润跑得更远）

# ── 训练元信息 ──
training:
  total_rounds: 0
  windows_passed: 0
  windows_total: 6
  best_excess_return: 0.0
  last_train_date: null
