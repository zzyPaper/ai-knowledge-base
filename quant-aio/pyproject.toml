[project]
name = "quant-aio"
version = "0.1.0"
description = "A股热门板块实时分析 & 量化买卖策略系统（含自循环回测优化）"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "akshare>=1.14",
    "baostock>=0.8",
    "pyyaml>=6.0",
    "schedule>=1.2",
    "rich>=13.0",
    "tabulate>=0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
